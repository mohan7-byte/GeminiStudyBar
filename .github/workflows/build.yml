                  top_row.addStretch()

                  # Screen Snip Button (Triggers Windows Win+Shift+S Snipping Tool)
                  self.snip_btn = QPushButton("📸 Snip")
                  self.snip_btn.setProperty("class", "iconBtn")
                  self.snip_btn.setToolTip("Trigger Win + Shift + S screen snip")
                  self.snip_btn.clicked.connect(self.trigger_screen_snip)
                  top_row.addWidget(self.snip_btn)

                  # Live WebSocket Mode Toggle Button
                  self.live_btn = QPushButton("🎙 Live")
                  self.live_btn.setProperty("class", "iconBtn")
                  self.live_btn.setToolTip("Start/Stop Gemini Live real-time voice & screen session")
                  self.live_btn.clicked.connect(self.toggle_live_mode)
