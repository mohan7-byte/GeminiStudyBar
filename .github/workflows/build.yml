                  self.send_btn.clicked.connect(lambda: self.submit_query(mode="normal"))
                  input_row.addWidget(self.send_btn)

                  card_layout.addLayout(input_row)

                  # Quick Action Pills Row (Hint Only, Step-by-Step, Attached Snip Badge, Stop)
                  pills_row = QHBoxLayout()
                  pills_row.setSpacing(6)

                  self.hint_btn = QPushButton("💡 Hint Only")
                  self.hint_btn.setProperty("class", "pillBtn")
                  self.hint_btn.clicked.connect(lambda: self.submit_query(mode="hint"))
                  pills_row.addWidget(self.hint_btn)

                  self.step_btn = QPushButton("📝 Step-by-Step")
                  self.step_btn.setProperty("class", "pillBtn")
                  self.step_btn.clicked.connect(lambda: self.submit_query(mode="steps"))
                  pills_row.addWidget(self.step_btn)

                  self.snip_badge_btn = QPushButton("📎 Snip Attached ✕")
                  self.snip_badge_btn.setProperty("class", "pillBtn")
                  self.snip_badge_btn.setStyleSheet(
                      "background-color: rgba(129, 201, 149, 0.16); color: #81C995; "
                      "border: 1px solid #3C6E4B; border-radius: 11px; padding: 4px 10px; font-size: 11.5px;"
                  )
                  self.snip_badge_btn.setToolTip("Click to remove attached screenshot")
                  self.snip_badge_btn.clicked.connect(self.clear_attached_snip)
                  self.snip_badge_btn.hide()
                  pills_row.addWidget(self.snip_badge_btn)

                  pills_row.addStretch()

                  self.stop_btn = QPushButton("⏹ Stop")
                  self.stop_btn.setProperty("class", "pillBtn")
                  self.stop_btn.setStyleSheet(
                      "background-color: rgba(242, 139, 130, 0.16); color: #F28B82; "
                      "border: 1px solid #6E3B37; border-radius: 11px; padding: 4px 10px;"
                  )
                  self.stop_btn.clicked.connect(self.stop_active_generation)
                  self.stop_btn.hide()
                  pills_row.addWidget(self.stop_btn)

                  self.toggle_panel_btn = QPushButton("▾ Hide Answer")
                  self.toggle_panel_btn.setProperty("class", "pillBtn")
                  self.toggle_panel_btn.clicked.connect(self.toggle_response_panel)
                  self.toggle_panel_btn.hide()
                  pills_row.addWidget(self.toggle_panel_btn)

                  card_layout.addLayout(pills_row)

                  # Expandable Response View (WebEngine with KaTeX or Fallback TextBrowser)
                  self.response_container = QFrame()
                  resp_layout = QVBoxLayout(self.response_container)
                  resp_layout.setContentsMargins(0, 4, 0, 0)

                  self.use_webengine = False
                  if HAS_WEBENGINE:
                      try:
                          self.web_view = QWebEngineView()
                          self.web_view.page().setBackgroundColor(QColor("#141418"))
                          self.web_view.setHtml(HTML_TEMPLATE)
                          self.web_view.setMinimumHeight(330)
                          resp_layout.addWidget(self.web_view)
                          self.use_webengine = True
                      except Exception:
                          self.use_webengine = False

                  if not self.use_webengine:
                      self.text_browser = QTextBrowser()
                      self.text_browser.setOpenExternalLinks(True)
                      self.text_browser.setMinimumHeight(330)
                      self.text_browser.setStyleSheet(
                          "background-color: #141418; color: #ECECF1; border: 1px solid #282A34; "
                          "border-radius: 12px; padding: 10px; font-size: 13.5px;"
                      )
                      resp_layout.addWidget(self.text_browser)

                  self.response_container.hide()
                  card_layout.addWidget(self.response_container)

                  self.root_layout.addWidget(self.card)

                  # Position nicely near top-right of primary screen
                  self.resize(470, 128)
                  screen_geo = QGuiApplication.primaryScreen().availableGeometry()
                  self.move(screen_geo.right() - 500, screen_geo.top() + 40)

              # -----------------------------------------------------------------------
              # Helpers for UI State, Dragging & Opacity
              # -----------------------------------------------------------------------
              def _update_badge(self):
                  model = self.config.get("model_name", "gemini-3.8-flash")
                  think = self.config.get("thinking_level", "low")
                  self.model_badge.setText(f"{model} · {think}")

              def _apply_opacity(self):
                  op = max(0.35, min(1.0, float(self.config.get("opacity", 95)) / 100.0))
                  self.setWindowOpacity(op)

              def collapse_to_orb(self):
                  self.card.hide()
                  self.orb_btn.show()
                  self.resize(120, 50)

              def expand_from_orb(self):
                  self.orb_btn.hide()
                  self.card.show()
                  if self.response_container.isVisible():
                      self.resize(470, 480)
                  else:
                      self.resize(470, 128)

              def show_response_panel(self):
                  if self.orb_btn.isVisible():
                      self.orb_btn.hide()
                      self.card.show()
                  if not self.response_container.isVisible():
                      self.response_container.show()
                      self.toggle_panel_btn.setText("▴ Hide Answer")
                      self.toggle_panel_btn.show()
                      self.resize(470, 480)

              def toggle_response_panel(self):
                  if self.response_container.isVisible():
                      self.response_container.hide()
                      self.toggle_panel_btn.setText("▾ Show Answer")
                      self.resize(470, 128)
                  else:
                      self.response_container.show()
                      self.toggle_panel_btn.setText("▴ Hide Answer")
                      self.resize(470, 480)

              def mousePressEvent(self, event):
                  if event.button() == Qt.MouseButton.LeftButton:
                      self.drag_pos = event.globalPosition().toPoint() - self.frameGeometry().topLeft()
                      event.accept()

              def mouseMoveEvent(self, event):
                  if event.buttons() & Qt.MouseButton.LeftButton and not self.drag_pos.isNull():
                      self.move(event.globalPosition().toPoint() - self.drag_pos)
                      event.accept()

              # -----------------------------------------------------------------------
              # Automatic Win + Shift + S Clipboard Screen Snip Detection
              # -----------------------------------------------------------------------
              def _current_clipboard_image_hash(self):
                  cb = QApplication.clipboard()
                  mime = cb.mimeData()
                  if mime and mime.hasImage():
                      qimg = cb.image()
                      if not qimg.isNull():
                          ba = QBuffer()
                          ba.open(QIODevice.OpenModeFlag.WriteOnly)
                          qimg.save(ba, "PNG")
                          return hashlib.sha1(bytes(ba.data())).hexdigest()
                  return None

              def _qimage_to_pil(self, qimg: QImage) -> Image.Image:
                  ba = QBuffer()
                  ba.open(QIODevice.OpenModeFlag.WriteOnly)
                  qimg.save(ba, "PNG")
                  return Image.open(io.BytesIO(bytes(ba.data()))).convert("RGB")

              def trigger_screen_snip(self):
                  # Launches Windows 10 built-in Win+Shift+S Snip & Sketch overlay
                  QDesktopServices.openUrl(QUrl("ms-screenclip:"))

              def _on_clipboard_changed(self):
                  if not self.config.get("auto_clipboard_snip", True):
                      return
                  cb = QApplication.clipboard()
                  mime = cb.mimeData()
                  if not (mime and mime.hasImage()):
                      return
                  qimg = cb.image()
                  if qimg.isNull():
                      return

                  new_hash = self._current_clipboard_image_hash()
                  if not new_hash or new_hash == self.last_clip_hash:
                      return
                  self.last_clip_hash = new_hash

                  pil_img = self._qimage_to_pil(qimg)
                  self.attached_pil_image = pil_img
                  self.snip_badge_btn.setText(
                      f"📎 Snip ({pil_img.width}×{pil_img.height}) ✕"
                  )
                  self.snip_badge_btn.show()

                  # Pop open floating bar if minimized to floating button
                  if self.orb_btn.isVisible():
                      self.expand_from_orb()
                  self.activateWindow()
                  self.query_input.setFocus()

                  # If Gemini Live mode is running, also stream the snip immediately
                  if self.live_worker and self.live_worker.isRunning():
                      self.live_worker.send_image(pil_img)

              def clear_attached_snip(self):
                  self.attached_pil_image = None
                  self.snip_badge_btn.hide()

              # -----------------------------------------------------------------------
              # Display Rendering Helpers (KaTeX WebEngine + Fallback)
              # -----------------------------------------------------------------------
              def _ui_add_message(self, role: str, text: str):
                  self.show_response_panel()
                  if self.use_webengine:
                      safe = json.dumps(text)
                      self.web_view.page().runJavaScript(f"window.addMessage('{role}', {safe});")
                  else:
                      prefix = "<b>You:</b> " if role == "user" else "<b>Gemini:</b> "
                      self.text_browser.append(f"<p>{prefix}{text}</p><hr>")

              def _ui_stream_ai(self, text: str):
                  self.show_response_panel()
                  if self.use_webengine:
                      safe = json.dumps(text)
                      self.web_view.page().runJavaScript(f"window.updateStreamingAI({safe});")

              def _ui_finalize_stream(self, full_text: str):
                  if self.use_webengine:
                      self.web_view.page().runJavaScript("window.finalizeStreamingAI();")
                  else:
                      self.text_browser.append(f"<p><b>Gemini:</b><br>{full_text}</p><hr>")

              def _ui_clear_chat(self):
                  if self.use_webengine:
                      self.web_view.page().runJavaScript("window.clearChat();")
                  else:
                      self.text_browser.clear()

              # -----------------------------------------------------------------------
              # Query Submission (Normal, Hint Only, Step-by-Step, or Live Text)
              # -----------------------------------------------------------------------
              def submit_query(self, mode="normal"):
                  api_key = self.config.get("api_key", "").strip()
                  if not api_key:
                      self.open_settings()
                      return

                  raw_query = self.query_input.text().strip()
                  if mode == "hint":
                      prompt = (
                          (raw_query or "Look at this question.")
                          + "\n\n[Instruction: Give ONLY a short conceptual hint and the relevant "
                            "formula or first step. Do NOT reveal the final answer yet.]"
                      )
                      display_user = (raw_query or "📸 [Snip]") + " (💡 Hint Only)"
                  elif mode == "steps":
                      prompt = (
                          (raw_query or "Solve the question shown in the image.")
                          + "\n\n[Instruction: Solve this completely step-by-step. State the "
                            "formula clearly, show each substitution, and highlight the final answer.]"
                      )
                      display_user = (raw_query or "📸 [Snip]") + " (📝 Step-by-Step)"
                  else:
                      if not raw_query and self.attached_pil_image is not None:
                          prompt = "Solve and explain the question in this screenshot clearly."
                          display_user = "📸 [Solve attached snip]"
                      elif raw_query:
                          prompt = raw_query
                          display_user = raw_query
                      else:
                          return

                  self.query_input.clear()

                  # If Live Mode is active, route text (and any snip) over Live WebSocket
                  if self.live_worker and self.live_worker.isRunning():
                      self._ui_add_message("user", display_user)
                      if self.attached_pil_image is not None:
                          self.live_worker.send_image(self.attached_pil_image)
                          self.clear_attached_snip()
                      self.live_worker.send_text(prompt)
                      return

                  # Standard Streaming Chat Mode
                  self.stop_active_generation()
                  img_to_send = self.attached_pil_image
                  if img_to_send is not None:
                      display_user = "📎 " + display_user
                  self._ui_add_message("user", display_user)
                  self.clear_attached_snip()

                  self.stop_btn.show()
                  self.chat_worker = ChatStreamWorker(
                      api_key=api_key,
                      model_name=self.config.get("model_name", "gemini-3.8-flash"),
                      thinking_level=self.config.get("thinking_level", "low"),
                      system_instruction=self.config.get("custom_instructions", ""),
                      history=self.chat_history,
                      user_text=prompt,
                      pil_image=img_to_send
                  )
                  self._pending_user_prompt = prompt
                  self._pending_pil_image = img_to_send
                  self.chat_worker.chunk_signal.connect(self._ui_stream_ai)
                  self.chat_worker.done_signal.connect(self._on_chat_done)
                  self.chat_worker.error_signal.connect(self._on_chat_error)
                  self.chat_worker.start()

              def _on_chat_done(self, full_text: str):
                  self.stop_btn.hide()
                  self._ui_finalize_stream(full_text)
                  # Append turn to multi-turn follow-up memory
                  parts = []
                  if getattr(self, "_pending_pil_image", None) is not None:
                      buf = io.BytesIO()
                      self._pending_pil_image.convert("RGB").save(buf, format="JPEG", quality=85)
                      parts.append(types.Part.from_bytes(data=buf.getvalue(), mime_type="image/jpeg"))
                  parts.append(types.Part.from_text(text=self._pending_user_prompt))
                  self.chat_history.append(types.Content(role="user", parts=parts))
                  self.chat_history.append(
                      types.Content(role="model", parts=[types.Part.from_text(text=full_text)])
                  )

              def _on_chat_error(self, err_msg: str):
                  self.stop_btn.hide()
                  self._ui_add_message("status", f"⚠️ Error: {err_msg}")

              def stop_active_generation(self):
                  if self.chat_worker and self.chat_worker.isRunning():
                      self.chat_worker.stop()
                      self.chat_worker.wait(300)
                  self.stop_btn.hide()

              def reset_session(self):
                  self.stop_active_generation()
                  if self.live_worker and self.live_worker.isRunning():
                      self.live_worker.stop()
                  self.chat_history.clear()
                  self.clear_attached_snip()
                  self._ui_clear_chat()
                  self._ui_add_message("status", "✨ Session cleared. Ready for a new question!")

              # -----------------------------------------------------------------------
              # Gemini Live WebSocket Mode
              # -----------------------------------------------------------------------
              def toggle_live_mode(self):
                  if self.live_worker and self.live_worker.isRunning():
                      self.live_worker.stop()
                      return

                  api_key = self.config.get("api_key", "").strip()
                  if not api_key:
                      self.open_settings()
                      return

                  self.live_btn.setText("🔴 Stop Live")
                  self.live_btn.setStyleSheet(
                      "background-color: rgba(242, 139, 130, 0.22); color: #F28B82; "
                      "border: 1px solid #F28B82; border-radius: 10px; padding: 4px 9px; font-weight: 700;"
                  )
                  self.live_worker = LiveWebSocketWorker(
                      api_key=api_key,
                      live_model=self.config.get(
                          "live_model_name", "gemini-2.5-flash-native-audio-preview-12-2025"
                      ),
                      system_instruction=self.config.get("custom_instructions", "")
                  )
                  self.live_worker.status_signal.connect(
                      lambda msg: self._ui_add_message("status", msg)
                  )
                  self.live_worker.transcript_signal.connect(self._on_live_transcript)
                  self.live_worker.error_signal.connect(
                      lambda err: self._ui_add_message("status", f"⚠️ {err}")
                  )
                  self.live_worker.stopped_signal.connect(self._on_live_stopped)
                  self.live_worker.start()

                  # If a snip is already attached, send it once connected
                  if self.attached_pil_image is not None:
                      img_copy = self.attached_pil_image
                      QTimer.singleShot(1500, lambda: self.live_worker.send_image(img_copy))

              def _on_live_transcript(self, kind: str, text: str):
                  if kind == "ai_stream":
                      self._ui_stream_ai(text)
                  elif kind == "ai_done":
                      self._ui_finalize_stream(text)

              def _on_live_stopped(self):
                  self.live_btn.setText("🎙 Live")
                  self.live_btn.setStyleSheet("")
                  self._ui_add_message("status", "Live session ended.")

              # -----------------------------------------------------------------------
              # Settings Dialog Handler
              # -----------------------------------------------------------------------
              def open_settings(self):
                  dlg = SettingsDialog(self, self.config)
                  if dlg.exec() == QDialog.DialogCode.Accepted:
                      self.config = load_config()
                      self._update_badge()
                      self._apply_opacity()


          if __name__ == "__main__":
              app = QApplication(sys.argv)
              app.setQuitOnLastWindowClosed(True)
              win = StudyAssistantApp()
              win.show()
              sys.exit(app.exec())
          EOF

      - name: Verify Python Syntax Before Packaging
        shell: bash
        run: |
          python -m py_compile study_assistant.py

      - name: Build Standalone Windows EXE with PyInstaller
        shell: bash
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "GeminiStudyBar" \
            --collect-all google.genai \
            --collect-all sounddevice \
            --hidden-import PIL.Image \
            --hidden-import websockets \
            --hidden-import aiohttp \
            study_assistant.py

      - name: Upload GeminiStudyBar.exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeminiStudyBar-Windows10
          path: dist/GeminiStudyBar.exe
