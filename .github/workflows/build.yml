              def _toggle_key_visibility(self):
                  if self.key_edit.echoMode() == QLineEdit.EchoMode.Password:
                      self.key_edit.setEchoMode(QLineEdit.EchoMode.Normal)
                      self.show_key_btn.setText("Hide")
                  else:
                      self.key_edit.setEchoMode(QLineEdit.EchoMode.Password)
                      self.show_key_btn.setText("Show")

              def _save(self):
                  self.config["api_key"] = self.key_edit.text().strip()
                  self.config["model_name"] = self.model_combo.currentText().strip()
                  self.config["thinking_level"] = self.thinking_combo.currentText().strip()
                  self.config["theme"] = self.theme_combo.currentText().strip()
                  self.config["live_model_name"] = self.live_model_combo.currentText().strip()
                  self.config["custom_instructions"] = self.inst_edit.toPlainText().strip()
                  self.config["opacity"] = self.op_slider.value()
                  self.config["auto_clipboard_snip"] = self.clip_check.isChecked()
                  save_config(self.config)
                  self.accept()


