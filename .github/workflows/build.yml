name: Build Gemini Study Bar EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install google-genai PyQt6 pillow sounddevice numpy websockets aiohttp pyinstaller

      - name: Generate Application Source (study_assistant.py)
        shell: bash
        run: |
          cat << 'EOF' > study_assistant.py
          import sys
          import os
          import io
          import re
          import html
          import json
          import math
          import struct
          import hashlib
          import asyncio
          import threading
          import queue
          from datetime import datetime
          from pathlib import Path
          from PIL import Image

          from PyQt6.QtCore import (
              Qt, QPoint, QRect, QRectF, QSize, QThread, pyqtSignal,
              QBuffer, QIODevice, QTimer, QUrl
          )
          from PyQt6.QtGui import (
              QGuiApplication, QPixmap, QImage, QFont, QColor, QCursor,
              QDesktopServices, QPainter, QPainterPath, QPen, QBrush
          )
          from PyQt6.QtWidgets import (
              QApplication, QWidget, QVBoxLayout, QHBoxLayout, QLineEdit,
              QPushButton, QLabel, QDialog, QComboBox, QPlainTextEdit,
              QSlider, QCheckBox, QFrame, QTextBrowser, QScrollArea,
              QSizeGrip, QProgressBar, QSizePolicy
          )

          try:
              import sounddevice as sd
              HAS_AUDIO = True
          except Exception:
              HAS_AUDIO = False

          from google import genai
          from google.genai import types

          # ---------------------------------------------------------------------------
          # Local Configuration Manager
          # ---------------------------------------------------------------------------
          CONFIG_DIR = Path.home() / ".gemini_study_bar"
          CONFIG_FILE = CONFIG_DIR / "settings.json"

          DEFAULT_CONFIG = {
              "api_key": "",
              "model_name": "gemini-3.8-flash",
              "live_model_name": "gemini-2.5-flash-native-audio-preview-12-2025",
              "thinking_level": "low",
              "theme": "dark",
              "custom_instructions": (
                  "You are a concise, clear study tutor. Use clean LaTeX math ($...$ for inline "
                  "and $$...$$ for block equations). State formulas clearly, show step-by-step "
                  "substitutions, and highlight the final answer."
              ),
              "opacity": 96,
              "auto_clipboard_snip": True
          }

          def load_config() -> dict:
              CONFIG_DIR.mkdir(parents=True, exist_ok=True)
              if CONFIG_FILE.exists():
                  try:
                      data = json.loads(CONFIG_FILE.read_text(encoding="utf-8"))
                      merged = DEFAULT_CONFIG.copy()
                      merged.update(data)
                      return merged
                  except Exception:
                      pass
              return DEFAULT_CONFIG.copy()

          def save_config(cfg: dict):
              CONFIG_DIR.mkdir(parents=True, exist_ok=True)
              CONFIG_FILE.write_text(json.dumps(cfg, indent=2), encoding="utf-8")


          # ---------------------------------------------------------------------------
          # Apple / Google Minimal Theme Palettes (Dark & Light Mode)
          # ---------------------------------------------------------------------------
          THEMES = {
              "dark": {
                  "window_bg": "#15161C",
                  "window_border": "#2E3240",
                  "panel_bg": "#1B1D26",
                  "panel_border": "#2A2E3D",
                  "input_bg": "#222531",
                  "input_border": "#34394B",
                  "input_focus": "#8AB4F8",
                  "text_primary": "#F1F3F9",
                  "text_secondary": "#A5ACBE",
                  "accent": "#8AB4F8",
                  "accent_text": "#0F1218",
                  "btn_bg": "#232633",
                  "btn_border": "#33384A",
                  "btn_hover": "#2E3344",
                  "user_card_bg": "#20283A",
                  "user_card_border": "#314163",
                  "ai_card_bg": "#1E202B",
                  "ai_card_border": "#2D3142",
                  "math_block_bg": "#14161F",
                  "math_block_border": "#333A52",
                  "code_bg": "#12131A",
                  "live_bar_bg": "#192231",
                  "live_bar_border": "#2E4568"
              },
              "light": {
                  "window_bg": "#F7F8FC",
                  "window_border": "#D5D9E4",
                  "panel_bg": "#FFFFFF",
                  "panel_border": "#E1E5F0",
                  "input_bg": "#FFFFFF",
                  "input_border": "#C9D0E0",
                  "input_focus": "#1A73E8",
                  "text_primary": "#1C1E26",
                  "text_secondary": "#5A6275",
                  "accent": "#1A73E8",
                  "accent_text": "#FFFFFF",
                  "btn_bg": "#EEF1F8",
                  "btn_border": "#D4DAE8",
                  "btn_hover": "#E2E7F4",
                  "user_card_bg": "#E8F0FE",
                  "user_card_border": "#C2D7FA",
                  "ai_card_bg": "#FFFFFF",
                  "ai_card_border": "#DFE3EE",
                  "math_block_bg": "#F1F4FB",
                  "math_block_border": "#C9D4EC",
                  "code_bg": "#F0F2F8",
                  "live_bar_bg": "#E8F0FE",
                  "live_bar_border": "#A8C7FA"
              }
          }


          # ---------------------------------------------------------------------------
          # Rich Math (LaTeX) + Markdown to HTML Formatter for Native Cards
          # ---------------------------------------------------------------------------
          LATEX_SYMBOLS = {
              r"\alpha": "α", r"\beta": "β", r"\gamma": "γ", r"\delta": "δ",
              r"\epsilon": "ε", r"\varepsilon": "ε", r"\zeta": "ζ", r"\eta": "η",
              r"\theta": "θ", r"\iota": "ι", r"\kappa": "κ", r"\lambda": "λ",
              r"\mu": "μ", r"\nu": "ν", r"\xi": "ξ", r"\pi": "π", r"\rho": "ρ",
              r"\sigma": "σ", r"\tau": "τ", r"\upsilon": "υ", r"\phi": "φ",
              r"\varphi": "φ", r"\chi": "χ", r"\psi": "ψ", r"\omega": "ω",
              r"\Gamma": "Γ", r"\Delta": "Δ", r"\Theta": "Θ", r"\Lambda": "Λ",
              r"\Xi": "Ξ", r"\Pi": "Π", r"\Sigma": "Σ", r"\Phi": "Φ",
              r"\Psi": "Ψ", r"\Omega": "Ω",
              r"\infty": "∞", r"\pm": "±", r"\mp": "∓", r"\times": "×",
              r"\div": "÷", r"\cdot": "·", r"\ast": "∗", r"\star": "⋆",
              r"\leq": "≤", r"\le": "≤", r"\geq": "≥", r"\ge": "≥",
              r"\neq": "≠", r"\ne": "≠", r"\approx": "≈", r"\equiv": "≡",
              r"\sim": "∼", r"\propto": "∝", r"\partial": "∂", r"\nabla": "∇",
              r"\forall": "∀", r"\exists": "∃", r"\in": "∈", r"\notin": "∉",
              r"\subset": "⊂", r"\subseteq": "⊆", r"\cup": "∪", r"\cap": "∩",
              r"\emptyset": "∅", r"\therefore": "∴", r"\because": "∵",
              r"\rightarrow": "→", r"\to": "→", r"\leftarrow": "←",
              r"\leftrightarrow": "↔", r"\Rightarrow": "⇒", r"\Leftarrow": "⇐",
              r"\Leftrightarrow": "⇔", r"\iff": "⇔", r"\implies": "⇒",
              r"\int": "∫", r"\iint": "∬", r"\oint": "∮", r"\sum": "∑",
              r"\prod": "∏", r"\angle": "∠", r"\perp": "⊥", r"\parallel": "∥",
              r"\triangle": "△", r"\degree": "°", r"\circ": "°",
              r"\dots": "…", r"\cdots": "⋯", r"\ldots": "…"
          }

          def convert_latex_math_to_html(expr: str, accent_color: str) -> str:
              s = expr.strip()
              # Handle \text{...} and \mathrm{...}
              s = re.sub(r"\\(?:text|mathrm|mathbf)\{([^{}]*)\}", r"\1", s)
              # Handle fractions \frac{a}{b} (supports nested once)
              for _ in range(3):
                  s = re.sub(
                      r"\\(?:d?frac)\{([^{}]+)\}\{([^{}]+)\}",
                      r"<span style='font-weight:600;'>(\1)⁄(\2)</span>",
                      s
                  )
              # Handle square roots \sqrt[n]{x} and \sqrt{x}
              s = re.sub(r"\\sqrt\[([^\[\]]+)\]\{([^{}]+)\}", r"<sup>\1</sup>√(\2)", s)
              s = re.sub(r"\\sqrt\{([^{}]+)\}", r"√(\1)", s)
              # Replace known LaTeX symbols (sort longest first)
              for k in sorted(LATEX_SYMBOLS.keys(), key=len, reverse=True):
                  s = s.replace(k, LATEX_SYMBOLS[k])
              # Remove leftover sizing commands
              s = re.sub(r"\\(?:left|right|big|Big|bigg|Bigg|,|;|!|quad|qquad)\b", " ", s)
              # Handle superscripts ^{...} and ^x
              s = re.sub(r"\^\{([^{}]+)\}", r"<sup>\1</sup>", s)
              s = re.sub(r"\^([a-zA-Z0-9\+\-\*])", r"<sup>\1</sup>", s)
              # Handle subscripts _{...} and _x
              s = re.sub(r"_\{([^{}]+)\}", r"<sub>\1</sub>", s)
              s = re.sub(r"_([a-zA-Z0-9\+\-])", r"<sub>\1</sub>", s)
              # Clean remaining braces
              s = s.replace("{", "").replace("}", "")
              return (
                  f"<span style='font-family:\"Cambria Math\",\"Times New Roman\",serif; "
                  f"color:{accent_color}; font-weight:600;'>{s}</span>"
              )

          def render_markdown_and_math(raw_text: str, theme_dict: dict) -> str:
              if not raw_text:
                  return ""

              text = raw_text.replace("\r\n", "\n")
              accent = theme_dict["accent"]
              math_bg = theme_dict["math_block_bg"]
              math_border = theme_dict["math_block_border"]
              code_bg = theme_dict["code_bg"]
              txt_color = theme_dict["text_primary"]

              placeholders = {}
              counter = [0]

              def save_placeholder(html_fragment: str) -> str:
                  key = f"@@PH_{counter[0]}@@"
                  counter[0] += 1
                  placeholders[key] = html_fragment
                  return key

              # 1. Extract fenced code blocks ```...```
              def repl_code_block(match):
                  lang = (match.group(1) or "").strip()
                  code_body = html.escape(match.group(2).strip())
                  lang_header = (
                      f"<div style='font-size:10.5px; color:{accent}; font-weight:700; "
                      f"margin-bottom:4px; text-transform:uppercase;'>{lang}</div>"
                      if lang else ""
                  )
                  block_html = (
                      f"<div style='background:{code_bg}; border:1px solid {math_border}; "
                      f"border-radius:8px; padding:8px 10px; margin:8px 0; "
                      f"font-family:Consolas,monospace; font-size:12.5px; white-space:pre-wrap;'>"
                      f"{lang_header}{code_body}</div>"
                  )
                  return save_placeholder(block_html)

              text = re.sub(r"```([a-zA-Z0-9_\-\+]*)\n([\s\S]*?)```", repl_code_block, text)

              # 2. Extract block math $$...$$ or [...]
              def repl_block_math(match):
                  inner = html.escape(match.group(1).strip())
                  converted = convert_latex_math_to_html(inner, accent)
                  box_html = (
                      f"<div style='background:{math_bg}; border-left:3px solid {accent}; "
                      f"border-radius:6px; padding:8px 12px; margin:8px 0; "
                      f"font-size:14.5px; text-align:center;'>{converted}</div>"
                  )
                  return save_placeholder(box_html)

              text = re.sub(r"\$\$([\s\S]*?)\$\$", repl_block_math, text)
              text = re.sub(r"\\\[([\s\S]*?)\\\]", repl_block_math, text)

              # 3. Extract inline math $...$ or \(...\)
              def repl_inline_math(match):
                  inner = html.escape(match.group(1).strip())
                  return save_placeholder(convert_latex_math_to_html(inner, accent))

              text = re.sub(r"\$([^\$\n]+?)\$", repl_inline_math, text)
              text = re.sub(r"\\\(([\s\S]+?)\\\)", repl_inline_math, text)

              # 4. Escape remaining HTML safely
              text = html.escape(text)

              # 5. Inline code `...`
              text = re.sub(
                  r"`([^`\n]+)`",
                  lambda m: (
                      f"<code style='background:{code_bg}; padding:1px 5px; "
                      f"border-radius:4px; font-family:Consolas,monospace; font-size:12.5px;'>"
                      f"{m.group(1)}</code>"
                  ),
                  text
              )

              # 6. Bold & Italic
              text = re.sub(r"\*\*([^\*\n]+)\*\*", r"<b>\1</b>", text)
              text = re.sub(r"\*([^\*\n]+)\*", r"<i>\1</i>", text)

              # 7. Process lines (headers, bullets, numbered steps)
              lines = text.split("\n")
              out_lines = []
              for line in lines:
                  stripped = line.strip()
                  if not stripped:
                      out_lines.append("<div style='height:6px;'></div>")
                  elif stripped.startswith("### "):
                      out_lines.append(
                          f"<div style='font-size:14px; font-weight:700; color:{accent}; "
                          f"margin:8px 0 3px 0;'>{stripped[4:]}</div>"
                      )
                  elif stripped.startswith("## "):
                      out_lines.append(
                          f"<div style='font-size:15px; font-weight:700; color:{accent}; "
                          f"margin:10px 0 4px 0;'>{stripped[3:]}</div>"
                      )
                  elif stripped.startswith("# "):
                      out_lines.append(
                          f"<div style='font-size:16px; font-weight:800; color:{accent}; "
                          f"margin:10px 0 4px 0;'>{stripped[2:]}</div>"
                      )
                  elif re.match(r"^(\*|\-)\s+", stripped):
                      item_body = re.sub(r"^(\*|\-)\s+", "", stripped)
                      out_lines.append(
                          f"<div style='margin:3px 0 3px 12px;'>• {item_body}</div>"
                      )
                  elif re.match(r"^\d+\.\s+", stripped):
                      out_lines.append(
                          f"<div style='margin:4px 0 4px 8px;'>{stripped}</div>"
                      )
                  else:
                      out_lines.append(f"<div style='margin:2px 0;'>{line}</div>")

              final_html = "\n".join(out_lines)
              for k, v in placeholders.items():
                  final_html = final_html.replace(k, v)

              return (
                  f"<div style='color:{txt_color}; font-family:\"Segoe UI\",sans-serif; "
                  f"font-size:13.5px; line-height:1.55;'>{final_html}</div>"
              )


          # ---------------------------------------------------------------------------
          # Standard & Streaming Chat Worker (Multi-Turn Memory + Thinking Level)
          # ---------------------------------------------------------------------------
          class ChatStreamWorker(QThread):
              chunk_signal = pyqtSignal(str)
              done_signal = pyqtSignal(str)
              error_signal = pyqtSignal(str)

              def __init__(self, api_key: str, model_name: str, thinking_level: str,
                           system_instruction: str, history: list, user_text: str,
                           pil_image=None):
                  super().__init__()
                  self.api_key = api_key.strip()
                  self.model_name = model_name.strip() or "gemini-3.8-flash"
                  self.thinking_level = thinking_level.strip().lower()
                  self.system_instruction = system_instruction.strip()
                  self.history = history
                  self.user_text = user_text
                  self.pil_image = pil_image
                  self._abort = False

              def stop(self):
                  self._abort = True

              def _build_config(self, include_thinking=True):
                  kwargs = {}
                  if self.system_instruction:
                      kwargs["system_instruction"] = self.system_instruction
                  if include_thinking and self.thinking_level in ("minimal", "low", "medium", "high"):
                      try:
                          kwargs["thinking_config"] = types.ThinkingConfig(
                              thinking_level=self.thinking_level
                          )
                      except Exception:
                          pass
                  return types.GenerateContentConfig(**kwargs)

              def run(self):
                  try:
                      client = genai.Client(api_key=self.api_key)
                      contents = list(self.history)

                      parts = []
                      if self.pil_image is not None:
                          buf = io.BytesIO()
                          self.pil_image.convert("RGB").save(buf, format="JPEG", quality=88)
                          parts.append(
                              types.Part.from_bytes(data=buf.getvalue(), mime_type="image/jpeg")
                          )
                      parts.append(types.Part.from_text(text=self.user_text))
                      contents.append(types.Content(role="user", parts=parts))

                      full_text = ""
                      try:
                          stream = client.models.generate_content_stream(
                              model=self.model_name,
                              contents=contents,
                              config=self._build_config(include_thinking=True)
                          )
                          for chunk in stream:
                              if self._abort:
                                  break
                              if getattr(chunk, "text", None):
                                  full_text += chunk.text
                                  self.chunk_signal.emit(full_text)
                      except Exception as first_err:
                          if "thinking" in str(first_err).lower():
                              stream = client.models.generate_content_stream(
                                  model=self.model_name,
                                  contents=contents,
                                  config=self._build_config(include_thinking=False)
                              )
                              for chunk in stream:
                                  if self._abort:
                                      break
                                  if getattr(chunk, "text", None):
                                      full_text += chunk.text
                                      self.chunk_signal.emit(full_text)
                          else:
                              raise first_err

                      if not self._abort:
                          self.done_signal.emit(full_text or "(No text returned)")
                  except Exception as e:
                      if not self._abort:
                          self.error_signal.emit(str(e))


          # ---------------------------------------------------------------------------
          # Gemini Live WebSocket Worker (With Mic Level Meter & Instant Disconnect)
          # ---------------------------------------------------------------------------
          class LiveWebSocketWorker(QThread):
              state_signal = pyqtSignal(str, str)       # (state_code, human_label)
              mic_level_signal = pyqtSignal(int)        # 0..100 voice level
              transcript_signal = pyqtSignal(str, str)  # ("stream" | "done", text)
              error_signal = pyqtSignal(str)
              stopped_signal = pyqtSignal()

              def __init__(self, api_key: str, live_model: str, system_instruction: str):
                  super().__init__()
                  self.api_key = api_key.strip()
                  self.live_model = (
                      live_model.strip() or "gemini-2.5-flash-native-audio-preview-12-2025"
                  )
                  self.system_instruction = system_instruction.strip()
                  self.running = False
                  self.out_queue = queue.Queue()
                  self._loop = None
                  self._main_task = None

              def send_text(self, text: str):
                  if self.running:
                      self.out_queue.put(("text", text))

              def send_image(self, pil_image: Image.Image):
                  if self.running:
                      buf = io.BytesIO()
                      pil_image.convert("RGB").save(buf, format="JPEG", quality=80)
                      self.out_queue.put(("image", buf.getvalue()))

              def stop(self):
                  """Immediately cancels the WebSocket tasks & closes the connection."""
                  self.running = False
                  self.out_queue.put(("stop", None))
                  if self._loop and self._main_task:
                      try:
                          self._loop.call_soon_threadsafe(self._main_task.cancel)
                      except Exception:
                          pass

              async def _session_loop(self):
                  client = genai.Client(api_key=self.api_key)
                  cfg_kwargs = {
                      "response_modalities": ["AUDIO"],
                      "output_audio_transcription": types.AudioTranscriptionConfig(),
                      "input_audio_transcription": types.AudioTranscriptionConfig(),
                  }
                  if self.system_instruction:
                      cfg_kwargs["system_instruction"] = types.Content(
                          parts=[types.Part.from_text(text=self.system_instruction)]
                      )
                  config = types.LiveConnectConfig(**cfg_kwargs)

                  self.state_signal.emit("connecting", f"Connecting ({self.live_model})...")
                  async with client.aio.live.connect(model=self.live_model, config=config) as session:
                      self.state_signal.emit("listening", "🟢 LIVE · Listening (Mic Active — Speak or Snip)")

                      audio_out_q = queue.Queue()
                      mic_stream = None

                      if HAS_AUDIO:
                          def mic_callback(indata, frames, time_info, status):
                              if not self.running:
                                  return
                              raw_bytes = bytes(indata)
                              self.out_queue.put(("audio", raw_bytes))
                              # Compute real-time voice level (0..100) for visual meter
                              try:
                                  count = len(raw_bytes) // 2
                                  if count > 0:
                                      shorts = struct.unpack(f"<{count}h", raw_bytes)
                                      sum_sq = sum(s * s for s in shorts[::4])
                                      rms = math.sqrt(sum_sq / max(1, count // 4))
                                      level = min(100, int((rms / 3500.0) * 100))
                                      self.mic_level_signal.emit(level)
                              except Exception:
                                  pass

                          def spk_writer():
                              try:
                                  with sd.RawOutputStream(samplerate=24000, channels=1, dtype="int16") as spk:
                                      while self.running:
                                          try:
                                              pcm = audio_out_q.get(timeout=0.15)
                                              if pcm and self.running:
                                                  spk.write(pcm)
                                          except queue.Empty:
                                              continue
                              except Exception:
                                  pass

                          threading.Thread(target=spk_writer, daemon=True).start()
                          try:
                              mic_stream = sd.RawInputStream(
                                  samplerate=16000, channels=1, dtype="int16",
                                  blocksize=1600, callback=mic_callback
                              )
                              mic_stream.start()
                          except Exception as mic_err:
                              self.state_signal.emit(
                                  "listening", f"🟢 LIVE Connected (Mic unavailable: {mic_err})"
                              )

                      async def sender():
                          while self.running:
                              try:
                                  kind, payload = self.out_queue.get_nowait()
                                  if kind == "stop":
                                      break
                                  elif kind == "audio":
                                      await session.send_realtime_input(
                                          audio=types.Blob(data=payload, mime_type="audio/pcm;rate=16000")
                                      )
                                  elif kind == "image":
                                      await session.send_realtime_input(
                                          video=types.Blob(data=payload, mime_type="image/jpeg")
                                      )
                                      self.state_signal.emit(
                                          "listening", "📸 Snip sent to Live — Ask your question!"
                                      )
                                  elif kind == "text":
                                      await session.send_realtime_input(text=payload)
                              except queue.Empty:
                                  await asyncio.sleep(0.02)

                      async def receiver():
                          ai_text_acc = ""
                          while self.running:
                              async for response in session.receive():
                                  if not self.running:
                                      break
                                  sc = getattr(response, "server_content", None)
                                  if not sc:
                                      continue
                                  if getattr(sc, "model_turn", None):
                                      self.state_signal.emit("speaking", "🔵 LIVE · Gemini Speaking...")
                                      for part in sc.model_turn.parts:
                                          if getattr(part, "inline_data", None) and part.inline_data.data:
                                              audio_out_q.put(part.inline_data.data)
                                          if getattr(part, "text", None):
                                              ai_text_acc += part.text
                                              self.transcript_signal.emit("stream", ai_text_acc)
                                  if getattr(sc, "output_transcription", None) and sc.output_transcription.text:
                                      ai_text_acc += sc.output_transcription.text
                                      self.transcript_signal.emit("stream", ai_text_acc)
                                  if getattr(sc, "turn_complete", False):
                                      if ai_text_acc:
                                          self.transcript_signal.emit("done", ai_text_acc)
                                          ai_text_acc = ""
                                      self.state_signal.emit(
                                          "listening", "🟢 LIVE · Listening (Mic Active)"
                                      )

                      self._main_task = asyncio.gather(sender(), receiver())
                      try:
                          await self._main_task
                      except asyncio.CancelledError:
                          pass
                      finally:
                          if mic_stream:
                              try:
                                  mic_stream.stop()
                                  mic_stream.close()
                              except Exception:
                                  pass

              def run(self):
                  self.running = True
                  self._loop = asyncio.new_event_loop()
                  asyncio.set_event_loop(self._loop)
                  try:
                      self._loop.run_until_complete(self._session_loop())
                  except asyncio.CancelledError:
                      pass
                  except Exception as e:
                      if self.running:
                          self.error_signal.emit(f"Live Mode Error: {e}")
                  finally:
                      self.running = False
                      try:
                          self._loop.close()
                      except Exception:
                          pass
                      self.mic_level_signal.emit(0)
                      self.stopped_signal.emit()


          # ---------------------------------------------------------------------------
          # Draggable Floating Pill Button (Fixes cursor offset & right-edge screen drag)
          # ---------------------------------------------------------------------------
          class DraggableOrbButton(QPushButton):
              clicked_without_drag = pyqtSignal()

              def __init__(self, text: str, parent=None):
                  super().__init__(text, parent)
                  self._press_global = None
                  self._win_start = None
                  self._dragged = False

              def mousePressEvent(self, event):
                  if event.button() == Qt.MouseButton.LeftButton:
                      self._press_global = event.globalPosition().toPoint()
                      self._win_start = self.window().frameGeometry().topLeft()
                      self._dragged = False
                      event.accept()
                  else:
                      super().mousePressEvent(event)

              def mouseMoveEvent(self, event):
                  if event.buttons() & Qt.MouseButton.LeftButton and self._press_global is not None:
                      delta = event.globalPosition().toPoint() - self._press_global
                      if delta.manhattanLength() > 4:
                          self._dragged = True
                          self.window().move(self._win_start + delta)
                      event.accept()
                  else:
                      super().mouseMoveEvent(event)

              def mouseReleaseEvent(self, event):
                  if event.button() == Qt.MouseButton.LeftButton:
                      if not self._dragged:
                          self.clicked_without_drag.emit()
                      self._press_global = None
                      event.accept()
                  else:
                      super().mouseReleaseEvent(event)


          # ---------------------------------------------------------------------------
          # Visual Response Card Widget (With Copy Button, Math Formatting & Theme Support)
          # ---------------------------------------------------------------------------
          class ResponseCard(QFrame):
              def __init__(self, role: str, raw_text: str, theme_name: str = "dark", parent=None):
                  super().__init__(parent)
                  self.role = role
                  self.raw_text = raw_text
                  self.theme_name = theme_name
                  self.timestamp = datetime.now().strftime("%I:%M %p")

                  self.layout = QVBoxLayout(self)
                  self.layout.setContentsMargins(12, 9, 12, 10)
                  self.layout.setSpacing(6)

                  # Header Row (Role + Timestamp + Copy Button)
                  header = QHBoxLayout()
                  header.setSpacing(6)

                  self.role_lbl = QLabel()
                  header.addWidget(self.role_lbl)
                  header.addStretch()

                  self.copy_btn = QPushButton("📋 Copy")
                  self.copy_btn.setCursor(QCursor(Qt.CursorShape.PointingHandCursor))
                  self.copy_btn.setFixedHeight(24)
                  self.copy_btn.clicked.connect(self.copy_to_clipboard)
                  if self.role == "status":
                      self.copy_btn.hide()
                  header.addWidget(self.copy_btn)

                  self.layout.addLayout(header)

                  # Rich Formatted Content View
                  self.viewer = QTextBrowser()
                  self.viewer.setOpenExternalLinks(True)
                  self.viewer.setFrameShape(QFrame.Shape.NoFrame)
                  self.viewer.setVerticalScrollBarPolicy(Qt.ScrollBarPolicy.ScrollBarAlwaysOff)
                  self.viewer.setHorizontalScrollBarPolicy(Qt.ScrollBarPolicy.ScrollBarAsNeeded)
                  self.viewer.setSizePolicy(
                      QSizePolicy.Policy.Expanding, QSizePolicy.Policy.Minimum
                  )
                  self.viewer.document().setDocumentMargin(2)
                  self.viewer.document().contentsChanged.connect(self._adjust_height)
                  self.layout.addWidget(self.viewer)

                  self.apply_theme(self.theme_name)

              def _adjust_height(self):
                  doc_height = int(self.viewer.document().size().height()) + 10
                  self.viewer.setFixedHeight(max(26, doc_height))

              def resizeEvent(self, event):
                  super().resizeEvent(event)
                  self.viewer.document().setTextWidth(max(200, self.viewer.viewport().width()))
                  self._adjust_height()

              def update_content(self, new_text: str):
                  self.raw_text = new_text
                  t = THEMES.get(self.theme_name, THEMES["dark"])
                  self.viewer.setHtml(render_markdown_and_math(self.raw_text, t))
                  self.viewer.document().setTextWidth(max(200, self.viewer.viewport().width()))
                  self._adjust_height()

              def copy_to_clipboard(self):
                  QApplication.clipboard().setText(self.raw_text)
                  self.copy_btn.setText("✓ Copied!")
                  QTimer.singleShot(1400, lambda: self.copy_btn.setText("📋 Copy"))

              def apply_theme(self, theme_name: str):
                  self.theme_name = theme_name
                  t = THEMES.get(theme_name, THEMES["dark"])

                  if self.role == "user":
                      bg = t["user_card_bg"]
                      border = t["user_card_border"]
                      title = f"YOU · {self.timestamp}"
                  elif self.role == "status":
                      bg = t["math_block_bg"]
                      border = t["math_block_border"]
                      title = f"STATUS · {self.timestamp}"
                  else:
                      bg = t["ai_card_bg"]
                      border = t["ai_card_border"]
                      title = f"✦ GEMINI · {self.timestamp}"

                  self.setStyleSheet(f"""
                      ResponseCard {{
                          background-color: {bg};
                          border: 1px solid {border};
                          border-radius: 13px;
                      }}
                  """)
                  self.role_lbl.setText(title)
                  self.role_lbl.setStyleSheet(
                      f"color: {t['text_secondary']}; font-size: 10.5px; "
                      f"font-weight: 700; border: none; background: transparent;"
                  )
                  self.copy_btn.setStyleSheet(f"""
                      QPushButton {{
                          background-color: {t['btn_bg']};
                          border: 1px solid {t['btn_border']};
                          border-radius: 7px;
                          color: {t['text_primary']};
                          padding: 2px 8px;
                          font-size: 11px;
                          font-weight: 600;
                      }}
                      QPushButton:hover {{
                          background-color: {t['btn_hover']};
                          border: 1px solid {t['accent']};
                      }}
                  """)
                  self.viewer.setStyleSheet(
                      "background: transparent; border: none; selection-background-color: #3B68B8;"
                  )
                  self.update_content(self.raw_text)


