name: Build Gemini Study Bar EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install google-genai PyQt6 PyQt6-WebEngine pillow sounddevice websockets aiohttp pyinstaller

      - name: Generate Application Source (study_assistant.py)
        shell: bash
        run: |
          cat << 'EOF' > study_assistant.py
          import sys
          import os
          import io
          import json
          import hashlib
          import asyncio
          import threading
          import queue
          from pathlib import Path
          from PIL import Image

          from PyQt6.QtCore import (
              Qt, QPoint, QSize, QThread, pyqtSignal, QBuffer, QIODevice, QTimer, QUrl
          )
          from PyQt6.QtGui import (
              QGuiApplication, QPixmap, QImage, QFont, QColor, QCursor, QDesktopServices
          )
          from PyQt6.QtWidgets import (
              QApplication, QWidget, QVBoxLayout, QHBoxLayout, QLineEdit,
              QPushButton, QLabel, QDialog, QComboBox, QPlainTextEdit,
              QSlider, QCheckBox, QFrame, QTextBrowser, QMessageBox, QSizePolicy
          )

          try:
              from PyQt6.QtWebEngineWidgets import QWebEngineView
              HAS_WEBENGINE = True
          except Exception:
              HAS_WEBENGINE = False

          try:
              import sounddevice as sd
              HAS_AUDIO = True
          except Exception:
              HAS_AUDIO = False

          from google import genai
          from google.genai import types

          # ---------------------------------------------------------------------------
          # Local Configuration Manager
          # ---------------------------------------------------------------------------
          CONFIG_DIR = Path.home() / ".gemini_study_bar"
          CONFIG_FILE = CONFIG_DIR / "settings.json"

          DEFAULT_CONFIG = {
              "api_key": "",
              "model_name": "gemini-3.8-flash",
              "live_model_name": "gemini-2.5-flash-native-audio-preview-12-2025",
              "thinking_level": "low",
              "custom_instructions": (
                  "You are a concise, clear study tutor. Use clean LaTeX math ($...$ for inline "
                  "and $$...$$ for block equations). Highlight key formulas and final answers."
              ),
              "opacity": 95,
              "auto_clipboard_snip": True
          }

          def load_config() -> dict:
              CONFIG_DIR.mkdir(parents=True, exist_ok=True)
              if CONFIG_FILE.exists():
                  try:
                      data = json.loads(CONFIG_FILE.read_text(encoding="utf-8"))
                      merged = DEFAULT_CONFIG.copy()
                      merged.update(data)
                      return merged
                  except Exception:
                      pass
              return DEFAULT_CONFIG.copy()

          def save_config(cfg: dict):
              CONFIG_DIR.mkdir(parents=True, exist_ok=True)
              CONFIG_FILE.write_text(json.dumps(cfg, indent=2), encoding="utf-8")


          # ---------------------------------------------------------------------------
          # HTML + KaTeX + Marked.js Template for Smooth Math & Markdown Rendering
          # ---------------------------------------------------------------------------
          HTML_TEMPLATE = """<!DOCTYPE html>
          <html>
          <head>
          <meta charset="utf-8">
          <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
          <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
          <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
          <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
          <style>
            :root {
              color-scheme: dark;
            }
            * { box-sizing: border-box; }
            body {
              margin: 0;
              padding: 10px 12px;
              background-color: #141418;
              color: #ECECF1;
              font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
              font-size: 13.5px;
              line-height: 1.58;
              overflow-x: hidden;
            }
            ::-webkit-scrollbar { width: 6px; }
            ::-webkit-scrollbar-track { background: transparent; }
            ::-webkit-scrollbar-thumb { background: #32343E; border-radius: 3px; }
            .msg {
              margin-bottom: 12px;
              padding: 10px 14px;
              border-radius: 14px;
              word-wrap: break-word;
            }
            .msg.user {
              background: #232733;
              border: 1px solid #31374A;
              color: #D8E6FF;
              margin-left: 24px;
            }
            .msg.ai {
              background: #1B1C22;
              border: 1px solid #282A34;
              color: #F1F3F5;
            }
            .msg.status {
              background: rgba(138, 180, 248, 0.08);
              border: 1px dashed #3B4D6B;
              color: #9BB8ED;
              font-size: 12px;
              padding: 6px 10px;
              text-align: center;
            }
            .role-tag {
              font-size: 11px;
              font-weight: 600;
              text-transform: uppercase;
              letter-spacing: 0.5px;
              margin-bottom: 4px;
              opacity: 0.65;
            }
            p { margin: 0 0 8px 0; }
            p:last-child { margin-bottom: 0; }
            pre {
              background: #101115;
              border: 1px solid #282A34;
              padding: 8px 10px;
              border-radius: 8px;
              overflow-x: auto;
              font-family: "Cascadia Code", Consolas, monospace;
              font-size: 12.5px;
            }
            code {
              background: #23252E;
              padding: 1px 5px;
              border-radius: 5px;
              font-family: "Cascadia Code", Consolas, monospace;
              font-size: 12.5px;
            }
            pre code { background: transparent; padding: 0; }
            .katex-display {
              margin: 10px 0;
              overflow-x: auto;
              overflow-y: hidden;
              padding: 4px 0;
            }
          </style>
          </head>
          <body>
            <div id="chat"></div>
            <script>
              const chat = document.getElementById('chat');

              function renderMathSafe(el) {
                if (typeof renderMathInElement === 'function') {
                  try {
                    renderMathInElement(el, {
                      delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '$', right: '$', display: false},
                        {left: '\\\\(', right: '\\\\)', display: false},
                        {left: '\\\\[', right: '\\\\]', display: true}
                      ],
                      throwOnError: false
                    });
                  } catch (e) {}
                }
              }

              function formatMarkdownWithMath(rawText) {
                // Protect math blocks from Marked.js mangling underscores/asterisks
                const mathBlocks = [];
                let protectedText = rawText.replace(/(\\$\\$[\\s\\S]*?\\$\\$|\\$[^\\$\\n]+?\\$)/g, (match) => {
                  mathBlocks.push(match);
                  return `@@MATH_BLOCK_${mathBlocks.length - 1}@@`;
                });

                let html = (typeof marked !== 'undefined')
                  ? marked.parse(protectedText)
                  : protectedText.replace(/\\n/g, '<br>');

                html = html.replace(/@@MATH_BLOCK_(\\d+)@@/g, (_, idx) => mathBlocks[Number(idx)]);
                return html;
              }

              window.addMessage = function(role, rawText) {
                const div = document.createElement('div');
                div.className = 'msg ' + role;
                if (role === 'status') {
                  div.textContent = rawText;
                } else {
                  const tag = document.createElement('div');
                  tag.className = 'role-tag';
                  tag.textContent = role === 'user' ? 'You' : 'Gemini';
                  const body = document.createElement('div');
                  body.className = 'msg-body';
                  body.innerHTML = formatMarkdownWithMath(rawText);
                  div.appendChild(tag);
                  div.appendChild(body);
                  renderMathSafe(body);
                }
                chat.appendChild(div);
                window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
              };

              window.updateStreamingAI = function(rawText) {
                let last = chat.lastElementChild;
                if (!last || !last.classList.contains('streaming')) {
                  last = document.createElement('div');
                  last.className = 'msg ai streaming';
                  const tag = document.createElement('div');
                  tag.className = 'role-tag';
                  tag.textContent = 'Gemini';
                  const body = document.createElement('div');
                  body.className = 'msg-body';
                  last.appendChild(tag);
                  last.appendChild(body);
                  chat.appendChild(last);
                }
                const body = last.querySelector('.msg-body');
                body.innerHTML = formatMarkdownWithMath(rawText);
                renderMathSafe(body);
                window.scrollTo({ top: document.body.scrollHeight });
              };

              window.finalizeStreamingAI = function() {
                let last = chat.lastElementChild;
                if (last && last.classList.contains('streaming')) {
                  last.classList.remove('streaming');
                }
              };

              window.clearChat = function() {
                chat.innerHTML = '';
              };
            </script>
          </body>
          </html>
          """


          # ---------------------------------------------------------------------------
          # Standard & Streaming Chat Worker (Multi-Turn Memory + Thinking Level)
          # ---------------------------------------------------------------------------
          class ChatStreamWorker(QThread):
              chunk_signal = pyqtSignal(str)
              done_signal = pyqtSignal(str)
              error_signal = pyqtSignal(str)

              def __init__(self, api_key: str, model_name: str, thinking_level: str,
                           system_instruction: str, history: list, user_text: str,
                           pil_image=None):
                  super().__init__()
                  self.api_key = api_key.strip()
                  self.model_name = model_name.strip() or "gemini-3.8-flash"
                  self.thinking_level = thinking_level.strip().lower()
                  self.system_instruction = system_instruction.strip()
                  self.history = history
                  self.user_text = user_text
                  self.pil_image = pil_image
                  self._abort = False

              def stop(self):
                  self._abort = True

              def _build_config(self, include_thinking=True):
                  kwargs = {}
                  if self.system_instruction:
                      kwargs["system_instruction"] = self.system_instruction
                  if include_thinking and self.thinking_level in ("minimal", "low", "medium", "high"):
                      try:
                          kwargs["thinking_config"] = types.ThinkingConfig(
                              thinking_level=self.thinking_level
                          )
                      except Exception:
                          pass
                  return types.GenerateContentConfig(**kwargs)

              def run(self):
                  try:
                      client = genai.Client(api_key=self.api_key)
                      contents = list(self.history)

                      parts = []
                      if self.pil_image is not None:
                          buf = io.BytesIO()
                          self.pil_image.convert("RGB").save(buf, format="JPEG", quality=88)
                          parts.append(
                              types.Part.from_bytes(data=buf.getvalue(), mime_type="image/jpeg")
                          )
                      parts.append(types.Part.from_text(text=self.user_text))
                      user_content = types.Content(role="user", parts=parts)
                      contents.append(user_content)

                      full_text = ""
                      try:
                          stream = client.models.generate_content_stream(
                              model=self.model_name,
                              contents=contents,
                              config=self._build_config(include_thinking=True)
                          )
                          for chunk in stream:
                              if self._abort:
                                  break
                              if getattr(chunk, "text", None):
                                  full_text += chunk.text
                                  self.chunk_signal.emit(full_text)
                      except Exception as first_err:
                          # Fallback if the chosen model does not support thinking_level
                          if "thinking" in str(first_err).lower():
                              stream = client.models.generate_content_stream(
                                  model=self.model_name,
                                  contents=contents,
                                  config=self._build_config(include_thinking=False)
                              )
                              for chunk in stream:
                                  if self._abort:
                                      break
                                  if getattr(chunk, "text", None):
                                      full_text += chunk.text
                                      self.chunk_signal.emit(full_text)
                          else:
                              raise first_err

                      if not self._abort:
                          self.done_signal.emit(full_text or "(No text returned)")
                  except Exception as e:
                      self.error_signal.emit(str(e))


          # ---------------------------------------------------------------------------
          # Gemini Live WebSocket Worker (Bidirectional Audio + Screen Snip + Text)
          # ---------------------------------------------------------------------------
          class LiveWebSocketWorker(QThread):
              status_signal = pyqtSignal(str)
              transcript_signal = pyqtSignal(str, str)
              error_signal = pyqtSignal(str)
              stopped_signal = pyqtSignal()

              def __init__(self, api_key: str, live_model: str, system_instruction: str):
                  super().__init__()
                  self.api_key = api_key.strip()
                  self.live_model = live_model.strip() or "gemini-2.5-flash-native-audio-preview-12-2025"
                  self.system_instruction = system_instruction.strip()
                  self.running = False
                  self.out_queue = queue.Queue()

              def send_text(self, text: str):
                  self.out_queue.put(("text", text))

              def send_image(self, pil_image: Image.Image):
                  buf = io.BytesIO()
                  pil_image.convert("RGB").save(buf, format="JPEG", quality=80)
                  self.out_queue.put(("image", buf.getvalue()))

              def stop(self):
                  self.running = False
                  self.out_queue.put(("stop", None))

              async def _session_loop(self):
                  client = genai.Client(api_key=self.api_key)
                  cfg_kwargs = {
                      "response_modalities": ["AUDIO"],
                      "output_audio_transcription": types.AudioTranscriptionConfig(),
                      "input_audio_transcription": types.AudioTranscriptionConfig(),
                  }
                  if self.system_instruction:
                      cfg_kwargs["system_instruction"] = types.Content(
                          parts=[types.Part.from_text(text=self.system_instruction)]
                      )
                  config = types.LiveConnectConfig(**cfg_kwargs)

                  self.status_signal.emit(f"Connecting Live ({self.live_model})...")
                  async with client.aio.live.connect(model=self.live_model, config=config) as session:
                      self.status_signal.emit("🎙 Live Active — Speak or snip a question!")

                      audio_out_q = queue.Queue()
                      mic_stream = None
                      spk_stream = None

                      if HAS_AUDIO:
                          def mic_callback(indata, frames, time_info, status):
                              if self.running:
                                  self.out_queue.put(("audio", bytes(indata)))

                          def spk_writer():
                              try:
                                  with sd.RawOutputStream(samplerate=24000, channels=1, dtype="int16") as spk:
                                      while self.running:
                                          try:
                                              pcm = audio_out_q.get(timeout=0.2)
                                              if pcm:
                                                  spk.write(pcm)
                                          except queue.Empty:
                                              continue
                              except Exception:
                                  pass

                          threading.Thread(target=spk_writer, daemon=True).start()
                          try:
                              mic_stream = sd.RawInputStream(
                                  samplerate=16000, channels=1, dtype="int16",
                                  blocksize=1600, callback=mic_callback
                              )
                              mic_stream.start()
                          except Exception as mic_err:
                              self.status_signal.emit(f"Live connected (Mic unavailable: {mic_err})")

                      async def sender():
                          while self.running:
                              try:
                                  kind, payload = self.out_queue.get_nowait()
                                  if kind == "stop":
                                      break
                                  elif kind == "audio":
                                      await session.send_realtime_input(
                                          audio=types.Blob(data=payload, mime_type="audio/pcm;rate=16000")
                                      )
                                  elif kind == "image":
                                      await session.send_realtime_input(
                                          video=types.Blob(data=payload, mime_type="image/jpeg")
                                      )
                                      self.status_signal.emit("📸 Sent screen snip to Live session")
                                  elif kind == "text":
                                      await session.send_realtime_input(text=payload)
                              except queue.Empty:
                                  await asyncio.sleep(0.02)

                      async def receiver():
                          ai_text_acc = ""
                          while self.running:
                              async for response in session.receive():
                                  if not self.running:
                                      break
                                  sc = getattr(response, "server_content", None)
                                  if not sc:
                                      continue
                                  if getattr(sc, "model_turn", None):
                                      for part in sc.model_turn.parts:
                                          if getattr(part, "inline_data", None) and part.inline_data.data:
                                              audio_out_q.put(part.inline_data.data)
                                          if getattr(part, "text", None):
                                              ai_text_acc += part.text
                                              self.transcript_signal.emit("ai_stream", ai_text_acc)
                                  if getattr(sc, "output_transcription", None) and sc.output_transcription.text:
                                      ai_text_acc += sc.output_transcription.text
                                      self.transcript_signal.emit("ai_stream", ai_text_acc)
                                  if getattr(sc, "turn_complete", False) and ai_text_acc:
                                      self.transcript_signal.emit("ai_done", ai_text_acc)
                                      ai_text_acc = ""

                      try:
                          await asyncio.gather(sender(), receiver())
                      finally:
                          if mic_stream:
                              try:
                                  mic_stream.stop()
                                  mic_stream.close()
                              except Exception:
                                  pass

              def run(self):
                  self.running = True
                  try:
                      asyncio.run(self._session_loop())
                  except Exception as e:
                      if self.running:
                          self.error_signal.emit(f"Live Mode Error: {e}")
                  finally:
                      self.running = False
                      self.stopped_signal.emit()


          # ---------------------------------------------------------------------------
          # Settings Dialog (Dotted API Key, Editable Model Names, Thinking, Opacity)
          # ---------------------------------------------------------------------------
          class SettingsDialog(QDialog):
              def __init__(self, parent, config: dict):
                  super().__init__(parent)
                  self.setWindowTitle("Study Bar Settings")
                  self.setFixedSize(430, 500)
                  self.config = config.copy()
                  self.setWindowFlags(Qt.WindowType.Dialog | Qt.WindowType.WindowStaysOnTopHint)
                  self.setStyleSheet("""
                      QDialog {
                          background-color: #16171D;
                          color: #ECECF1;
                          font-family: "Segoe UI", sans-serif;
                      }
                      QLabel {
                          color: #C9CCD6;
                          font-size: 12px;
                          font-weight: 600;
                      }
                      QLineEdit, QComboBox, QPlainTextEdit {
                          background-color: #21232C;
                          border: 1px solid #323544;
                          border-radius: 8px;
                          padding: 6px 10px;
                          color: #FFFFFF;
                          font-size: 13px;
                      }
                      QLineEdit:focus, QComboBox:focus, QPlainTextEdit:focus {
                          border: 1px solid #8AB4F8;
                      }
                      QPushButton {
                          background-color: #282B36;
                          border: 1px solid #383C4C;
                          border-radius: 8px;
                          padding: 7px 14px;
                          color: #ECECF1;
                          font-weight: 600;
                      }
                      QPushButton#saveBtn {
                          background-color: #8AB4F8;
                          color: #101218;
                          border: none;
                      }
                      QPushButton#saveBtn:hover {
                          background-color: #A3C5FA;
                      }
                      QCheckBox {
                          color: #D5D8E2;
                          font-size: 12.5px;
                      }
                  """)

                  layout = QVBoxLayout(self)
                  layout.setSpacing(10)
                  layout.setContentsMargins(18, 18, 18, 18)

                  # 1. API Key (Dotted Password Mode + Show Toggle)
                  layout.addWidget(QLabel("Google Gemini API Key (Saved Locally):"))
                  key_row = QHBoxLayout()
                  self.key_edit = QLineEdit(self.config.get("api_key", ""))
                  self.key_edit.setEchoMode(QLineEdit.EchoMode.Password)
                  self.key_edit.setPlaceholderText("Paste your AI Studio API key...")
                  self.show_key_btn = QPushButton("Show")
                  self.show_key_btn.setFixedWidth(60)
                  self.show_key_btn.clicked.connect(self._toggle_key_visibility)
                  key_row.addWidget(self.key_edit)
                  key_row.addWidget(self.show_key_btn)
                  layout.addLayout(key_row)

                  # 2. Editable Standard Model Selector
                  layout.addWidget(QLabel("Study Model (Select or type any future model name):"))
                  self.model_combo = QComboBox()
                  self.model_combo.setEditable(True)
                  presets = [
                      "gemini-3.8-flash",
                      "gemini-3.1-pro-preview",
                      "gemini-2.5-flash",
                      "gemini-2.5-pro"
                  ]
                  current_model = self.config.get("model_name", "gemini-3.8-flash")
                  if current_model not in presets:
                      presets.insert(0, current_model)
                  self.model_combo.addItems(presets)
                  self.model_combo.setCurrentText(current_model)
                  layout.addWidget(self.model_combo)

                  # 3. Thinking Level Selector
                  layout.addWidget(QLabel("Thinking Level (Lower = fewer tokens & faster):"))
                  self.thinking_combo = QComboBox()
                  self.thinking_combo.addItems(["low", "medium", "high", "minimal"])
                  self.thinking_combo.setCurrentText(self.config.get("thinking_level", "low"))
                  layout.addWidget(self.thinking_combo)

                  # 4. Editable Live WebSocket Model Selector
                  layout.addWidget(QLabel("Gemini Live WebSocket Model (Select or type):"))
                  self.live_model_combo = QComboBox()
                  self.live_model_combo.setEditable(True)
                  live_presets = [
                      "gemini-2.5-flash-native-audio-preview-12-2025",
                      "gemini-3.8-live",
                      "gemini-live-2.5-flash-preview"
                  ]
                  curr_live = self.config.get("live_model_name", live_presets[0])
                  if curr_live not in live_presets:
                      live_presets.insert(0, curr_live)
                  self.live_model_combo.addItems(live_presets)
                  self.live_model_combo.setCurrentText(curr_live)
                  layout.addWidget(self.live_model_combo)

                  # 5. Custom Permanent Instructions
                  layout.addWidget(QLabel("Custom Study Instructions (Applied to every session):"))
                  self.inst_edit = QPlainTextEdit(self.config.get("custom_instructions", ""))
                  self.inst_edit.setFixedHeight(85)
                  layout.addWidget(self.inst_edit)

                  # 6. Opacity Slider + Auto Win+Shift+S Toggle
                  op_row = QHBoxLayout()
                  self.op_label = QLabel(f"Window Opacity: {self.config.get('opacity', 95)}%")
                  self.op_slider = QSlider(Qt.Orientation.Horizontal)
                  self.op_slider.setRange(35, 100)
                  self.op_slider.setValue(int(self.config.get("opacity", 95)))
                  self.op_slider.valueChanged.connect(
                      lambda v: self.op_label.setText(f"Window Opacity: {v}%")
                  )
                  op_row.addWidget(self.op_label)
                  op_row.addWidget(self.op_slider)
                  layout.addLayout(op_row)

                  self.clip_check = QCheckBox(
                      "Auto-detect Win + Shift + S screen snips from clipboard"
                  )
                  self.clip_check.setChecked(bool(self.config.get("auto_clipboard_snip", True)))
                  layout.addWidget(self.clip_check)

                  # Save / Cancel Buttons
                  btn_row = QHBoxLayout()
                  btn_row.addStretch()
                  cancel_btn = QPushButton("Cancel")
                  cancel_btn.clicked.connect(self.reject)
                  save_btn = QPushButton("Save Settings")
                  save_btn.setObjectName("saveBtn")
                  save_btn.clicked.connect(self._save)
                  btn_row.addWidget(cancel_btn)
                  btn_row.addWidget(save_btn)
                  layout.addLayout(btn_row)

              def _toggle_key_visibility(self):
                  if self.key_edit.echoMode() == QLineEdit.EchoMode.Password:
                      self.key_edit.setEchoMode(QLineEdit.EchoMode.Normal)
                      self.show_key_btn.setText("Hide")
                  else:
                      self.key_edit.setEchoMode(QLineEdit.EchoMode.Password)
                      self.show_key_btn.setText("Show")

              def _save(self):
                  self.config["api_key"] = self.key_edit.text().strip()
                  self.config["model_name"] = self.model_combo.currentText().strip()
                  self.config["thinking_level"] = self.thinking_combo.currentText().strip()
                  self.config["live_model_name"] = self.live_model_combo.currentText().strip()
                  self.config["custom_instructions"] = self.inst_edit.toPlainText().strip()
                  self.config["opacity"] = self.op_slider.value()
                  self.config["auto_clipboard_snip"] = self.clip_check.isChecked()
                  save_config(self.config)
                  self.accept()


          # ---------------------------------------------------------------------------
          # Main Floating Orb + Floating Bar + Expandable Rounded Response App
          # ---------------------------------------------------------------------------
          class StudyAssistantApp(QWidget):
              def __init__(self):
                  super().__init__()
                  self.config = load_config()
                  self.chat_history = []
                  self.attached_pil_image = None
                  self.chat_worker = None
                  self.live_worker = None
                  self.drag_pos = QPoint()

                  # Track clipboard image hash so startup clipboard does not false-trigger
                  self.last_clip_hash = self._current_clipboard_image_hash()

                  self._init_ui()
                  self._apply_opacity()

                  # Listen to Windows Clipboard for Win + Shift + S snips
                  QApplication.clipboard().dataChanged.connect(self._on_clipboard_changed)

              def _init_ui(self):
                  self.setWindowTitle("Gemini Study Bar")
