                          font-size: 13px;
                          font-weight: 700;
                          border: none;
                      }}
                      QLabel#badgeLabel {{
                          color: {t['accent']};
                          background-color: {t['btn_bg']};
                          border: 1px solid {t['btn_border']};
                          border-radius: 8px;
                          padding: 2px 7px;
                          font-size: 11px;
                          font-weight: 600;
                      }}
                      QLineEdit#queryInput {{
                          background-color: {t['input_bg']};
                          border: 1px solid {t['input_border']};
                          border-radius: 12px;
                          padding: 8px 12px;
                          color: {t['text_primary']};
                          font-size: 13.5px;
                      }}
                      QLineEdit#queryInput:focus {{
                          border: 1.5px solid {t['input_focus']};
                      }}
                      QPushButton#askBtn {{
                          background-color: {t['accent']};
                          color: {t['accent_text']};
                          border: none;
