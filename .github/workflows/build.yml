                          font-weight: 700;
                      }}
                      QPushButton.iconBtn {{
                          background-color: {t['btn_bg']};
                          border: 1px solid {t['btn_border']};
                          border-radius: 9px;
                          color: {t['text_primary']};
                          padding: 4px 9px;
                          font-size: 12px;
                          font-weight: 600;
                      }}
                      QPushButton.iconBtn:hover {{
                          background-color: {t['btn_hover']};
                          border: 1px solid {t['accent']};
                      }}
                      QPushButton.pillBtn {{
                          background-color: {t['btn_bg']};
                          border: 1px solid {t['btn_border']};
                          border-radius: 10px;
                          color: {t['text_secondary']};
                          padding: 4px 10px;
                          font-size: 11.5px;
                          font-weight: 600;
                      }}
                      QPushButton.pillBtn:hover {{
                          background-color: {t['btn_hover']};
                          color: {t['text_primary']};
                          border: 1px solid {t['accent']};
                      }}
                  """)

                  self.scroll_area.setStyleSheet(f"""
                      QScrollArea {{
                          background-color: {t['panel_bg']};
                          border: 1px solid {t['panel_border']};
                          border-radius: 12px;
                      }}
                  """)
                  self.cards_host.setStyleSheet(f"background-color: {t['panel_bg']};")
                  self.resize_hint_lbl.setStyleSheet(
                      f"color: {t['text_secondary']}; font-size: 10px; border: none;"
                  )
                  self.live_state_lbl.setStyleSheet(
                      f"color: {t['text_primary']}; font-size: 11.5px; font-weight: 700; border: none;"
                  )
                  self.mic_meter.setStyleSheet(f"""
                      QProgressBar {{
                          background-color: {t['input_bg']};
                          border: 1px solid {t['btn_border']};
                          border-radius: 4px;
                      }}
                      QProgressBar::chunk {{
                          background-color: #34A853;
                          border-radius: 3px;
                      }}
                  """)

                  for card in self.cards:
                      card.apply_theme(theme_name)
                  self.update()

              def _update_badge(self):
                  model = self.config.get("model_name", "gemini-3.8-flash")
                  think = self.config.get("thinking_level", "low")
                  self.model_badge.setText(f"{model} · {think}")

              def _apply_opacity(self):
                  op = max(0.40, min(1.0, float(self.config.get("opacity", 96)) / 100.0))
                  self.setWindowOpacity(op)

              # -----------------------------------------------------------------------
              # Collapse / Expand & Free 8-Direction Edge Resizing
              # -----------------------------------------------------------------------
              def collapse_to_orb(self):
                  if self.response_container.isVisible():
                      self._saved_expanded_size = self.size()
                  else:
                      self._saved_bar_width = self.width()

                  # Anchor orb near the right side of where the bar was
                  old_geo = self.frameGeometry()
                  self.card.hide()
                  self.orb_btn.show()
                  self.root_layout.setContentsMargins(2, 2, 2, 2)
                  self.setMinimumSize(112, 40)
                  self.setMaximumSize(112, 40)
                  self.resize(112, 40)
                  self.move(old_geo.right() - 112, old_geo.top())

              def expand_from_orb(self):
                  orb_geo = self.frameGeometry()
                  self.orb_btn.hide()
                  self.root_layout.setContentsMargins(6, 6, 6, 6)
                  self.setMaximumSize(16777215, 16777215)
                  self.card.show()

                  if self.response_container.isVisible():
                      self.setMinimumSize(390, 280)
                      target_w = max(390, self._saved_expanded_size.width())
                      target_h = max(280, self._saved_expanded_size.height())
                      self.resize(target_w, target_h)
                  else:
                      self.setMinimumSize(390, 128)
                      target_w = max(390, self._saved_bar_width)
                      self.resize(target_w, 132)

                  # Keep window completely on screen when expanding from right edge
                  screen = QGuiApplication.screenAt(orb_geo.center()) or QGuiApplication.primaryScreen()
                  avail = screen.availableGeometry()
                  new_x = min(max(avail.left(), orb_geo.right() - self.width()), avail.right() - self.width())
                  new_y = min(max(avail.top(), orb_geo.top()), avail.bottom() - self.height())
                  self.move(new_x, new_y)

              def show_response_panel(self):
                  if self.orb_btn.isVisible():
                      self.expand_from_orb()
                  if not self.response_container.isVisible():
                      self.response_container.show()
                      self.toggle_panel_btn.setText("▴ Hide Answer")
                      self.toggle_panel_btn.show()
                      self.setMinimumSize(390, 280)
                      self.resize(
                          max(self.width(), self._saved_expanded_size.width()),
                          max(480, self._saved_expanded_size.height())
                      )

              def toggle_response_panel(self):
                  if self.response_container.isVisible():
                      self._saved_expanded_size = self.size()
                      self.response_container.hide()
                      self.toggle_panel_btn.setText("▾ Show Answer")
                      self.setMinimumSize(390, 128)
                      self.resize(self.width(), 132)
                  else:
                      self.show_response_panel()

              def _detect_resize_edges(self, pos: QPoint) -> str:
                  if self.orb_btn.isVisible():
                      return ""
                  m = self.RESIZE_MARGIN
                  w, h = self.width(), self.height()
                  edges = ""
                  if pos.y() <= m:
                      edges += "T"
                  elif pos.y() >= h - m:
                      edges += "B"
                  if pos.x() <= m:
                      edges += "L"
                  elif pos.x() >= w - m:
                      edges += "R"
                  return edges

              def _update_cursor_for_edges(self, edges: str):
                  if edges in ("TL", "BR"):
                      self.setCursor(Qt.CursorShape.SizeFDiagCursor)
                  elif edges in ("TR", "BL"):
                      self.setCursor(Qt.CursorShape.SizeBDiagCursor)
                  elif edges in ("L", "R"):
                      self.setCursor(Qt.CursorShape.SizeHorCursor)
                  elif edges in ("T", "B"):
                      self.setCursor(Qt.CursorShape.SizeVerCursor)
                  else:
                      self.setCursor(Qt.CursorShape.ArrowCursor)

              def mousePressEvent(self, event):
                  if event.button() == Qt.MouseButton.LeftButton and not self.orb_btn.isVisible():
                      edges = self._detect_resize_edges(event.position().toPoint())
                      if edges:
                          self._resize_edges = edges
                          self._resize_start_pos = event.globalPosition().toPoint()
                          self._resize_start_geo = self.geometry()
                      else:
                          self._drag_pos = (
                              event.globalPosition().toPoint() - self.frameGeometry().topLeft()
                          )
                      event.accept()

              def mouseMoveEvent(self, event):
                  if self.orb_btn.isVisible():
                      return
                  global_pt = event.globalPosition().toPoint()
                  local_pt = event.position().toPoint()

                  if event.buttons() & Qt.MouseButton.LeftButton:
                      if self._resize_edges and self._resize_start_geo is not None:
                          delta = global_pt - self._resize_start_pos
                          geo = QRect(self._resize_start_geo)
                          min_w, min_h = self.minimumWidth(), self.minimumHeight()

                          if "L" in self._resize_edges:
                              new_left = geo.left() + delta.x()
                              if geo.right() - new_left >= min_w:
                                  geo.setLeft(new_left)
                          if "R" in self._resize_edges:
                              geo.setWidth(max(min_w, geo.width() + delta.x()))
                          if "T" in self._resize_edges:
                              new_top = geo.top() + delta.y()
                              if geo.bottom() - new_top >= min_h:
                                  geo.setTop(new_top)
                          if "B" in self._resize_edges:
                              geo.setHeight(max(min_h, geo.height() + delta.y()))

                          self.setGeometry(geo)
                          event.accept()
                          return
                      elif self._drag_pos is not None:
                          self.move(global_pt - self._drag_pos)
                          event.accept()
                          return

                  self._update_cursor_for_edges(self._detect_resize_edges(local_pt))

              def mouseReleaseEvent(self, event):
                  self._resize_edges = ""
                  self._drag_pos = None
                  self.setCursor(Qt.CursorShape.ArrowCursor)

              # -----------------------------------------------------------------------
              # Automatic Win + Shift + S Clipboard Screen Snip Detection
              # -----------------------------------------------------------------------
              def _current_clipboard_image_hash(self):
                  cb = QApplication.clipboard()
                  mime = cb.mimeData()
                  if mime and mime.hasImage():
                      qimg = cb.image()
                      if not qimg.isNull():
                          ba = QBuffer()
                          ba.open(QIODevice.OpenModeFlag.WriteOnly)
                          qimg.save(ba, "PNG")
                          return hashlib.sha1(bytes(ba.data())).hexdigest()
                  return None

              def _qimage_to_pil(self, qimg: QImage) -> Image.Image:
                  ba = QBuffer()
                  ba.open(QIODevice.OpenModeFlag.WriteOnly)
                  qimg.save(ba, "PNG")
                  return Image.open(io.BytesIO(bytes(ba.data()))).convert("RGB")

              def trigger_screen_snip(self):
                  QDesktopServices.openUrl(QUrl("ms-screenclip:"))

              def _on_clipboard_changed(self):
                  if not self.config.get("auto_clipboard_snip", True):
                      return
                  cb = QApplication.clipboard()
                  mime = cb.mimeData()
                  if not (mime and mime.hasImage()):
                      return
                  qimg = cb.image()
                  if qimg.isNull():
                      return

                  new_hash = self._current_clipboard_image_hash()
                  if not new_hash or new_hash == self.last_clip_hash:
                      return
                  self.last_clip_hash = new_hash

                  pil_img = self._qimage_to_pil(qimg)
                  self.attached_pil_image = pil_img
                  self.snip_badge_btn.setText(f"📎 Snip ({pil_img.width}×{pil_img.height}) ✕")
                  self.snip_badge_btn.show()

                  if self.orb_btn.isVisible():
                      self.expand_from_orb()
                  self.activateWindow()
                  self.query_input.setFocus()

                  if self.live_worker and self.live_worker.isRunning():
                      self.live_worker.send_image(pil_img)

              def clear_attached_snip(self):
                  self.attached_pil_image = None
                  self.snip_badge_btn.hide()

              # -----------------------------------------------------------------------
              # Response Card Management & Copy Functionality
              # -----------------------------------------------------------------------
              def _scroll_to_bottom(self):
                  QTimer.singleShot(
                      30,
                      lambda: self.scroll_area.verticalScrollBar().setValue(
                          self.scroll_area.verticalScrollBar().maximum()
                      )
                  )

              def _ui_add_message(self, role: str, text: str):
                  self.show_response_panel()
                  card = ResponseCard(role, text, self.config.get("theme", "dark"), self.cards_host)
                  self.cards_layout.insertWidget(self.cards_layout.count() - 1, card)
                  self.cards.append(card)
                  if role == "ai":
                      self.latest_ai_text = text
                      self.copy_latest_btn.show()
                  self._scroll_to_bottom()

              def _ui_stream_ai(self, text: str):
                  self.show_response_panel()
                  if self.streaming_card is None:
                      self.streaming_card = ResponseCard(
                          "ai", text, self.config.get("theme", "dark"), self.cards_host
                      )
                      self.cards_layout.insertWidget(
                          self.cards_layout.count() - 1, self.streaming_card
                      )
                      self.cards.append(self.streaming_card)
                  else:
                      self.streaming_card.update_content(text)
                  self.latest_ai_text = text
                  self.copy_latest_btn.show()
                  self._scroll_to_bottom()

              def _ui_finalize_stream(self, full_text: str):
                  if self.streaming_card is not None:
                      self.streaming_card.update_content(full_text)
                      self.streaming_card = None
                  else:
                      self._ui_add_message("ai", full_text)
                  self.latest_ai_text = full_text
                  self.copy_latest_btn.show()
                  self._scroll_to_bottom()

              def copy_latest_response(self):
                  if self.latest_ai_text:
                      QApplication.clipboard().setText(self.latest_ai_text)
                      self.copy_latest_btn.setText("✓ Copied!")
                      QTimer.singleShot(
                          1400, lambda: self.copy_latest_btn.setText("📋 Copy Latest")
                      )

              def _ui_clear_chat(self):
                  self.streaming_card = None
                  self.latest_ai_text = ""
                  self.copy_latest_btn.hide()
                  for c in self.cards:
                      c.deleteLater()
                  self.cards.clear()

              # -----------------------------------------------------------------------
              # Query Submission & Session Control
              # -----------------------------------------------------------------------
              def submit_query(self, mode="normal"):
                  api_key = self.config.get("api_key", "").strip()
                  if not api_key:
                      self.open_settings()
                      return

                  raw_query = self.query_input.text().strip()
                  if mode == "hint":
                      prompt = (
                          (raw_query or "Look at this question.")
                          + "\n\n[Instruction: Give ONLY a short conceptual hint and the key "
                            "formula or first step. Do NOT reveal the final answer yet.]"
                      )
                      display_user = (raw_query or "📸 [Attached Snip]") + " (💡 Hint Only)"
                  elif mode == "steps":
                      prompt = (
                          (raw_query or "Solve the question shown in the image.")
                          + "\n\n[Instruction: Solve this completely step-by-step. State the "
                            "formula clearly, show each substitution, and highlight the final answer.]"
                      )
                      display_user = (raw_query or "📸 [Attached Snip]") + " (📝 Step-by-Step)"
                  else:
                      if not raw_query and self.attached_pil_image is not None:
                          prompt = "Solve and explain the question in this screenshot clearly."
                          display_user = "📸 [Solve attached snip]"
                      elif raw_query:
                          prompt = raw_query
                          display_user = raw_query
                      else:
                          return

                  self.query_input.clear()

                  if self.live_worker and self.live_worker.isRunning():
                      self._ui_add_message("user", display_user)
                      if self.attached_pil_image is not None:
                          self.live_worker.send_image(self.attached_pil_image)
                          self.clear_attached_snip()
                      self.live_worker.send_text(prompt)
                      return

                  self.stop_active_generation()
                  img_to_send = self.attached_pil_image
                  if img_to_send is not None:
                      display_user = "📎 " + display_user
                  self._ui_add_message("user", display_user)
                  self.clear_attached_snip()

                  self.stop_btn.show()
                  self.chat_worker = ChatStreamWorker(
                      api_key=api_key,
                      model_name=self.config.get("model_name", "gemini-3.8-flash"),
                      thinking_level=self.config.get("thinking_level", "low"),
                      system_instruction=self.config.get("custom_instructions", ""),
                      history=self.chat_history,
                      user_text=prompt,
                      pil_image=img_to_send
                  )
                  self._pending_user_prompt = prompt
                  self._pending_pil_image = img_to_send
                  self.chat_worker.chunk_signal.connect(self._ui_stream_ai)
                  self.chat_worker.done_signal.connect(self._on_chat_done)
                  self.chat_worker.error_signal.connect(self._on_chat_error)
                  self.chat_worker.start()

              def _on_chat_done(self, full_text: str):
                  self.stop_btn.hide()
                  self._ui_finalize_stream(full_text)
                  parts = []
                  if getattr(self, "_pending_pil_image", None) is not None:
                      buf = io.BytesIO()
                      self._pending_pil_image.convert("RGB").save(buf, format="JPEG", quality=85)
                      parts.append(types.Part.from_bytes(data=buf.getvalue(), mime_type="image/jpeg"))
                  parts.append(types.Part.from_text(text=self._pending_user_prompt))
                  self.chat_history.append(types.Content(role="user", parts=parts))
                  self.chat_history.append(
                      types.Content(role="model", parts=[types.Part.from_text(text=full_text)])
                  )

              def _on_chat_error(self, err_msg: str):
                  self.stop_btn.hide()
                  self.streaming_card = None
                  self._ui_add_message("status", f"⚠️ Error: {err_msg}")

              def stop_active_generation(self):
                  if self.chat_worker and self.chat_worker.isRunning():
                      self.chat_worker.stop()
                      self.chat_worker.wait(300)
                  self.streaming_card = None
                  self.stop_btn.hide()

              def reset_session(self):
                  self.stop_active_generation()
                  self.stop_live_mode_immediately()
                  self.chat_history.clear()
                  self.clear_attached_snip()
                  self._ui_clear_chat()
                  self._ui_add_message("status", "✨ Session cleared. Ready for a new question!")

              # -----------------------------------------------------------------------
              # Gemini Live WebSocket Mode (With Visual Bar & Instant Disconnect)
              # -----------------------------------------------------------------------
              def toggle_live_mode(self):
                  if self.live_worker and self.live_worker.isRunning():
                      self.stop_live_mode_immediately()
                      return

                  api_key = self.config.get("api_key", "").strip()
                  if not api_key:
                      self.open_settings()
                      return

                  self.live_btn.setText("🔴 Stop Live")
                  self.live_btn.setStyleSheet(
                      "background-color: #D93025; color: #FFFFFF; border: none; "
                      "border-radius: 9px; padding: 4px 9px; font-weight: 700;"
                  )
                  self.live_state_lbl.setText("🟡 Connecting to Gemini Live...")
                  self.mic_meter.setValue(0)
                  self.live_status_frame.show()
                  self.show_response_panel()

                  self.live_worker = LiveWebSocketWorker(
                      api_key=api_key,
                      live_model=self.config.get(
                          "live_model_name", "gemini-2.5-flash-native-audio-preview-12-2025"
                      ),
                      system_instruction=self.config.get("custom_instructions", "")
                  )
                  self.live_worker.state_signal.connect(self._on_live_state_change)
                  self.live_worker.mic_level_signal.connect(self.mic_meter.setValue)
                  self.live_worker.transcript_signal.connect(self._on_live_transcript)
                  self.live_worker.error_signal.connect(
                      lambda err: self._ui_add_message("status", f"⚠️ {err}")
                  )
                  self.live_worker.stopped_signal.connect(self._on_live_stopped)
                  self.live_worker.start()

                  if self.attached_pil_image is not None:
                      img_copy = self.attached_pil_image
                      QTimer.singleShot(1400, lambda: self.live_worker.send_image(img_copy))

              def stop_live_mode_immediately(self):
                  """Hard-disconnects the Live WebSocket immediately to prevent token drain."""
                  if self.live_worker:
                      self.live_worker.stop()
                      self.live_worker.wait(600)
                  self._on_live_stopped()

              def _on_live_state_change(self, state_code: str, label_text: str):
                  self.live_state_lbl.setText(label_text)

              def _on_live_transcript(self, kind: str, text: str):
                  if kind == "stream":
                      self._ui_stream_ai(text)
                  elif kind == "done":
                      self._ui_finalize_stream(text)

              def _on_live_stopped(self):
                  self.live_status_frame.hide()
                  self.mic_meter.setValue(0)
                  self.live_btn.setText("🎙 Live")
                  self.apply_theme()

              def open_settings(self):
                  dlg = SettingsDialog(self, self.config)
                  if dlg.exec() == QDialog.DialogCode.Accepted:
                      self.config = load_config()
                      self._update_badge()
                      self.apply_theme()
                      self._apply_opacity()


          if __name__ == "__main__":
              app = QApplication(sys.argv)
              app.setQuitOnLastWindowClosed(True)
              win = StudyAssistantApp()
              win.show()
              sys.exit(app.exec())
          EOF

      - name: Verify Python Syntax Before Packaging
        shell: bash
        run: |
          python -m py_compile study_assistant.py

      - name: Build Standalone Windows EXE with PyInstaller
        shell: bash
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "GeminiStudyBar" \
            --collect-all google.genai \
            --collect-all sounddevice \
            --hidden-import PIL.Image \
            --hidden-import websockets \
            --hidden-import aiohttp \
            study_assistant.py

      - name: Upload GeminiStudyBar.exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeminiStudyBar-Windows10
          path: dist/GeminiStudyBar.exe
