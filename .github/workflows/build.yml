              # -----------------------------------------------------------------------
              # Solid Rounded Background Painting & Theme Engine (Dark & Light Mode)
              # -----------------------------------------------------------------------
              def paintEvent(self, event):
                  if self.card.isVisible():
                      painter = QPainter(self)
                      painter.setRenderHint(QPainter.RenderHint.Antialiasing)
                      t = THEMES.get(self.config.get("theme", "dark"), THEMES["dark"])
                      rect = QRectF(self.card.geometry())
                      path = QPainterPath()
                      path.addRoundedRect(rect, 18.0, 18.0)
                      painter.fillPath(path, QBrush(QColor(t["window_bg"])))
                      pen = QPen(QColor(t["window_border"]), 1.2)
                      painter.setPen(pen)
                      painter.drawPath(path)

